<style>
  .caixa-exemplo {
    width: 200px;
    height: 150px;
    border: 2px solid #333;
    padding: 10px;
    /* Faz a mágica acontecer: esconde o excesso e coloca scroll */
    overflow: auto;
  }
</style>

<div class="caixa-exemplo">
  Este é um texto longo que vai causar um estouro na caixa.
  O CSS `overflow: auto` criará uma barra de rolagem automaticamente
  quando o conteúdo ultrapassar a altura ou largura definida,
  permitindo que o usuário visualize todo o texto sem
  quebrar o layout do site.
</div>
